<style>
:root{--ink:#23395B;--paper:#FFF9EA;--accent:#F3A712;--page:#E2D8BD}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);overflow:hidden;overscroll-behavior:none;
  font-family:'Shantell Sans','Comic Sans MS',cursive;color:var(--ink);-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.bar{position:absolute;left:0;right:0;display:flex;gap:10px;align-items:center;justify-content:center;padding:0 14px;pointer-events:none}
.bar>*{pointer-events:auto}
#top{top:calc(14px + env(safe-area-inset-top));justify-content:space-between}
.brand{font-weight:800;font-size:20px;letter-spacing:-.01em;pointer-events:none}
.by{display:block;margin-top:-1px;font-weight:600;font-size:12.5px;color:var(--ink);text-decoration:none}
.by span,.by u{opacity:.55}
.by u{text-decoration:none;border-bottom:1.5px dashed currentColor;padding-bottom:1px}
.by:hover u{opacity:1}
.hd{border:3px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;background:var(--paper);color:var(--ink);
  font:inherit;font-weight:700;font-size:18px;line-height:1.1;padding:11px 16px;cursor:pointer;
  transition:transform .1s;touch-action:manipulation;white-space:nowrap}
.hd:active{transform:scale(.95)}
.hd.primary{background:var(--accent)}
.hd.sm{font-size:15px;padding:8px 13px}
.face{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);padding:0;cursor:pointer;touch-action:manipulation;overflow:hidden}
.face svg{display:block;width:100%;height:100%}
.hd:disabled{opacity:.5;cursor:default}
/* the name is typed straight onto the picture; this unseen field only catches the keys (and opens the phone keyboard) */
#typeBar{position:absolute;left:50%;top:40%;width:1px;height:1px;overflow:hidden;opacity:0}
#name{width:40px;font-size:16px;border:0;padding:0;background:none;outline:none}
#panel{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:calc(100% - 36px);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:flex-end}
.row{display:flex;gap:8px;align-items:center}
/* phones: three centred lines (colours, wording, buttons), sized from the screen width so each always fits on one line */
#stage.phone #panel{left:0;right:0;max-width:none;flex-direction:column;flex-wrap:nowrap;gap:10px;padding:0 8px;bottom:calc(14px + env(safe-area-inset-bottom))}
#stage.phone #panel .row{gap:min(8px,1.8vw);justify-content:center}
#stage.phone #panel .hd{font-size:clamp(11px,3.7vw,15px);padding:8px clamp(6px,2.6vw,13px)}
/* wide screens: the end buttons sit bottom centre, so the colours and wording on the right never move when they appear */
#stage:not(.phone) #doneBar,#stage:not(.phone) #sceneBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom))}
@media (max-width:1480px){#stage:not(.phone) #doneBar,#stage:not(.phone) #sceneBar{bottom:calc(70px + env(safe-area-inset-bottom))}}   /* not enough room beside the right-hand group: one line up */
@media (max-height:560px){#stage.phone #panel{display:none}}   /* phone keyboard is up: the picture is short, so the controls step aside until it closes */
/* the end buttons rise in from below, all together */
@keyframes rise{from{transform:translateY(90px);opacity:0}}
#doneBar .hd{animation:rise .45s cubic-bezier(.22,1,.36,1) backwards}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid;padding:0;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.18);opacity:0;transition:opacity .3s}
#scrim.open{opacity:1}
/* the menu card: sits flush on the bottom edge and slides up from below */
#sheet{position:absolute;left:50%;transform:translate(-50%,105%);transition:transform .36s cubic-bezier(.22,1,.36,1);width:min(100%,480px);bottom:0;background:var(--paper);border:3px solid var(--ink);border-bottom:0;
  border-radius:22px 26px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:80%;overflow:auto}
#sheet.open{transform:translate(-50%,0)}
#sheet h3{margin:0 0 10px;font-size:15px;font-weight:700;opacity:.65}
#sheet h3:not(:first-child){margin-top:18px}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.on{outline:3px dashed var(--ink);outline-offset:3px}
#pv{display:block;height:150px;margin:14px auto 0;border:3px solid var(--ink);border-radius:10px}
#status{min-height:22px;margin-top:12px;font-size:15px}
#x{position:absolute;right:12px;top:8px;border:0;background:none;color:var(--ink);font:inherit;font-size:24px;font-weight:800;cursor:pointer;padding:4px 8px}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:18px;
  font-weight:700;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

    <div id="msgs" class="row"></div>

      <button class="hd sm" id="saveBtn" type="button">save</button>
      <button class="hd sm" id="shareBtn" type="button">share</button>

  </div>
  <div id="scrim" class="hidden"></div>
  <div id="sheet" class="hidden"></div>
  <div id="toast"></div>

    save(); translate(xc, base + (1 - eout(k)) * 46); rotate((rnd(hk + i, i, SEED) - .5) * 7 * D); scale(Math.max(.01, back(k)));

// ───────── one frame of the whole scene ─────────

const $ = id => document.getElementById(id);

function layout() {

    V.ox = 0; V.oy = ch >= sh ? (ch - sh) * .25 : cl(ch / 2 - 880 * V.k, ch - sh, 0);
    // the picture stands on the buttons: the ground and the front grass always end just above the top row, whatever the phone's height
    const pr = $('panel').getBoundingClientRect(), row = $('msgs').offsetHeight;
    if (pr.height && row) {

      V.k = Math.min(cw / W, (top - 58) / (FLOOR - 440));                          // short screens: a smaller picture, so the words stay below the title

addEventListener('resize', layout); layout();

let FREEZE = null, BUSY = false;
function frame() {

  const now = performance.now() / 1000; let st, time = now, live = false;
  if (FREEZE != null) { st = FREEZE; time = FREEZE + 1; }
  else if (S.phase === 'type') { st = -1; live = !S.intro; }
  else { st = now - S.goT; if (st > END && !S.ended) { S.ended = true; onEnd(); } }
  render({ st, time, live, vis: V.vis, intro: S.intro, was: S.was });

  if (v !== nameEl.value) nameEl.value = v;

  document.querySelectorAll('#sceneBar [data-who]').forEach(b => b.onclick = () => { S.who = b.dataset.who; try { localStorage.setItem('tg-who', S.who); } catch (e) {} after(); });
  document.querySelectorAll('#sceneBar [data-scene]').forEach(b => b.onclick = () => { S.scene = b.dataset.scene; try { localStorage.setItem('tg-scene', S.scene); } catch (e) {} after(); });
  document.querySelectorAll('#msgs [data-msg]').forEach(b => b.onclick = () => { S.msg = +b.dataset.msg; try { localStorage.setItem('tg-msg', S.msg); } catch (e) {} after(); });
}
function syncURL() { if (S.phase === 'story') { try { history.replaceState(null, '', shareURL(true)); } catch (e) {} } }
// one menu for both "save" and "share": pick a shape, see it, pick a format
function mediaSheet(mode) {
  const kinds = mode === 'save' ? ['video', 'jpg', 'png', 'svg'] : ['video', 'jpg', 'png', 'link'];
  openSheet('<h3>shape</h3><div class="grid">' + Object.entries(SHAPES).map(([k, v]) => `<button type="button" class="hd sm${k === S.shape ? ' on' : ''}" data-shape="${k}">${v.label}</button>`).join('') +
    `</div><canvas id="pv"></canvas><h3>${mode} as</h3><div class="grid">` + kinds.map((k, i) => `<button type="button" class="hd" data-s="${k}">${k}</button>`).join('') + '</div><div id="status"></div>');
  sheet.querySelectorAll('[data-shape]').forEach(b => b.onclick = () => { if (BUSY) return; S.shape = b.dataset.shape; mediaSheet(mode); });
  sheet.querySelectorAll('[data-s]').forEach(b => b.onclick = () => (mode === 'save' ? saveAs : shareAs)(b.dataset.s));
  // small picture of exactly what will be saved or shared
  const v = viewOf(S.shape), c = $('pv'), z = 320 / v.h; c.height = 320; c.width = Math.round(v.w * z);
  const g = c.getContext('2d'); render({ st: STILL, time: STILL, live: false, view: v }); g.setTransform(v.k * z, 0, 0, v.k * z, v.ox * z, v.oy * z); paint(g);
}
$('saveBtn').onclick = () => mediaSheet('save');
$('shareBtn').onclick = () => mediaSheet('share');

// ───────── saving ─────────
function dl(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 8000); }
function off(v) { const c = document.createElement('canvas'); c.width = v.w; c.height = v.h; return c; }
function drawTo(g, v, o) { render({ ...o, view: v }); g.setTransform(v.k, 0, 0, v.k, v.ox, v.oy); paint(g); }
function stillBlob(type, key = 'story') {
  const v = viewOf(key), c = off(v); drawTo(c.getContext('2d'), v, { st: STILL, time: STILL, live: false });
  return new Promise(r => c.toBlob(r, type, .93));
}
const status = m => { const s = $('status'); if (s) s.textContent = m; };
const fileName = () => fname() + (S.shape === 'story' ? '' : '-' + S.shape);
const lock = on => { BUSY = on; sheet.querySelectorAll('[data-s],[data-shape]').forEach(b => b.disabled = on); };
// makes the picture or video in the chosen shape; null if the video could not be made
async function makeFile(kind) {
  const v = viewOf(S.shape);
  if (kind === 'png') return { blob: await stillBlob('image/png', S.shape), ext: 'png' };
  if (kind === 'jpg') return { blob: await stillBlob('image/jpeg', S.shape), ext: 'jpg' };
  if (kind === 'svg') { render({ st: STILL, time: STILL, live: false, view: v }); return { blob: new Blob([toSVG(v)], { type: 'image/svg+xml' }), ext: 'svg' }; }
  lock(true);
  try { return await makeVideo(p => status(`drawing the video… ${Math.round(p * 100)}%`), S.shape); }
  catch (e) { console.error(e); status('video didn’t work in this browser — try Chrome, or use png'); return null; }
  finally { lock(false); }
}
async function saveAs(kind) {
  if (BUSY) return;
  const r = await makeFile(kind); if (!r) return;
  dl(r.blob, fileName() + '.' + r.ext); status('saved');
}
async function copyLink(url) { try { await navigator.clipboard.writeText(url); return true; } catch (e) { return false; } }
async function shareAs(kind) {
  if (BUSY) return;
  const url = shareURL(), text = `${MSGS[S.msg]}, ${S.name.trim()}.`;
  if (kind === 'link') {
    if (navigator.share) { try { await navigator.share({ title: 'touchgrass', text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    if (await copyLink(url)) status('link copied'); else prompt('copy this link', url);
    return;
  }
  const r = await makeFile(kind); if (!r) return;
  const file = new File([r.blob], fileName() + '.' + r.ext, { type: r.blob.type });
  const caption = `${text} make yours: ${SITE}`;      // a picture or video already shows the story, so the caption points to the plain site
  if (!(navigator.canShare && navigator.canShare({ files: [file] }))) {      // e.g. most desktop browsers: save the file and hand over the link instead
    dl(r.blob, file.name); status((await copyLink(url)) ? 'this browser can’t share files, so it was saved and the link was copied' : 'this browser can’t share files, so it was saved instead');
    return;
  }
  const send = async () => { try { await navigator.share({ files: [file], text: caption }); status(''); } catch (e) { if (e.name !== 'AbortError') { dl(r.blob, file.name); status('sharing didn’t open, so it was saved instead'); } } };
  if (kind !== 'video') return send();
  // the share menu opens by itself as soon as the video is drawn; only a browser that insists on a fresh tap gets a button to tap
  try { await navigator.share({ files: [file], text: caption }); status(''); }
  catch (e) {
    if (e.name === 'AbortError') { status(''); return; }
    const st = $('status'); st.innerHTML = '<button type="button" class="hd" id="sendIt">ready, tap to share</button>'; $('sendIt').onclick = send;
  }
}
// the whole story as one loop: 1s at the desk → story → hold → dip back to the start
const FPS = 30, LEAD = 1, VDUR = LEAD + END + 2.2;
function videoFrame(g, i, v) {
  const tv = i / FPS, dip = Math.max(1 - seg(tv, 0, .3), seg(tv, VDUR - .3, VDUR));
  drawTo(g, v, { st: tv - LEAD, time: tv, live: false, dip, clean: true });
}
async function makeVideo(progress, key = 'story') {
  const v = viewOf(key), c = off(v), g = c.getContext('2d'), N = Math.round(VDUR * FPS), W = v.w, H = v.h;
  if (window.VideoEncoder && window.Mp4Muxer) {
    let codec = null;
    for (const cd of ['avc1.640028', 'avc1.4d0028', 'avc1.420028']) {
      try { if ((await VideoEncoder.isConfigSupported({ codec: cd, width: W, height: H, bitrate: 5e6, framerate: FPS })).supported) { codec = cd; break; } } catch (e) {}
    }
    if (codec) {
      const mux = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: FPS }, fastStart: 'in-memory' });
      let err = null;
      const enc = new VideoEncoder({ output: (ch, meta) => mux.addVideoChunk(ch, meta), error: e => { err = e; } });
      enc.configure({ codec, width: W, height: H, bitrate: 5e6, framerate: FPS });
      for (let i = 0; i < N; i++) {
        if (err) throw err;
        videoFrame(g, i, v);
        const vf = new VideoFrame(c, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
        enc.encode(vf, { keyFrame: i % FPS === 0 }); vf.close();
        while (enc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 2));
        if (i % 6 === 0) { progress(i / N); await new Promise(r => setTimeout(r, 0)); }
      }
      await enc.flush(); if (err) throw err; mux.finalize();
      return { blob: new Blob([mux.target.buffer], { type: 'video/mp4' }), ext: 'mp4' };
    }
  }
  // fallback: record the canvas in real time
  const mime = typeof MediaRecorder !== 'undefined' && ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  if (!mime) throw new Error('no video encoder');
  const stream = c.captureStream(0), track = stream.getVideoTracks()[0], rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 10e6 }), chunks = [];
  rec.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
  const done = new Promise(r => { rec.onstop = r; });
  videoFrame(g, 0, v); rec.start(); const t0 = performance.now();
  for (let i = 0; i < N; i++) {
    videoFrame(g, i, v); if (track.requestFrame) track.requestFrame();
    if (i % 6 === 0) progress(i / N);
    await new Promise(r => setTimeout(r, Math.max(0, t0 + (i + 1) * 1000 / FPS - performance.now())));
  }
  rec.stop(); await done;
  return { blob: new Blob(chunks, { type: mime.split(';')[0] }), ext: mime.includes('mp4') ? 'mp4' : 'webm' };
}

// ───────── start ─────────
const q = new URLSearchParams(location.search);
let th = q.get('th'), m = q.get('m'), sc = q.get('s'), who = q.get('c');
// a shared link shows exactly what the sender picked; otherwise use what this visitor picked last time
if (!q.has('n')) try { th = th || localStorage.getItem('tg-theme'); if (m == null) m = localStorage.getItem('tg-msg'); sc = sc || localStorage.getItem('tg-scene'); who = who || localStorage.getItem('tg-who'); } catch (e) {}
S.scene = sc === 'desk' ? 'desk' : 'bed'; S.who = who === 'b' ? 'b' : 'a';
setTheme(th || 'retro', !q.has('n')); S.msg = cl(parseInt(m) || 0, 0, MSGS.length - 1); buildPanel(); layout();
if (q.has('t')) FREEZE = parseFloat(q.get('t'));             // ?t=5 freezes the story at 5s (for checking)
if (q.has('ui')) document.querySelectorAll('.bar,#panel').forEach(b => b.classList.add('hidden'));
const n0 = (q.get('n') || '').trim().slice(0, 16);
if (n0) {        // opened from a shared link: a moment on the opening picture, then the story plays for that name
  nameEl.value = n0; S.name = n0; S.births = [...n0].map(() => -9);
  if (FREEZE == null) { S.fromLink = true; S.intro = true; $('sceneBar').classList.add('hidden'); setTimeout(go, 1000); }
}
else if (!TOUCH) setTimeout(() => nameEl.focus({ preventScroll: true }), 80);
if (document.fonts && document.fonts.load) document.fonts.load(`800 100px ${FONT}`).catch(() => {});
frame();
})();
</script>
